<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TradePro - Professional Trading Platform</title>

    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            color: #d1d4dc;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* TOP BAR */

        .topbar {
            min-height: 58px;
            width: 100%;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 15px;

            overflow-x: auto;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-right: 10px;
            white-space: nowrap;
        }

        select,
        button {
            background: #131722;
            color: #d1d4dc;
            border: 1px solid #363a45;
            border-radius: 4px;
            padding: 8px 11px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        select:hover,
        button:hover {
            border-color: #2962ff;
        }

        button.active {
            background: #2962ff;
            color: white;
            border-color: #2962ff;
        }

        .symbol-select {
            min-width: 150px;
        }

        /* MAIN LAYOUT */

        .layout {
            display: flex;
            width: 100%;
            min-height: calc(100vh - 58px);
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 12px;
        }

        /* CHART HEADER */

        .chart-header {
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8px;
        }

        .stock-name {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            color: #787b86;
        }

        /* CHART */

        .chart-wrapper {
            width: 100%;
            height: 550px;
            position: relative;

            border: 1px solid #2a2e39;
            background: #131722;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        /* SIDE PANEL */

        .side-panel {
            width: 260px;
            background: #1e222d;
            border-left: 1px solid #2a2e39;
            padding: 15px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
        }

        .indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 11px 8px;
            margin-bottom: 7px;

            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 4px;
        }

        .indicator span {
            font-size: 13px;
        }

        .indicator button {
            padding: 5px 9px;
            font-size: 11px;
        }

        /* SIGNAL */

        .signal-box {
            margin-top: 20px;
            padding: 15px;

            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 5px;
        }

        .signal-title {
            font-size: 12px;
            color: #787b86;
            margin-bottom: 8px;
        }

        .signal {
            font-size: 20px;
            font-weight: bold;
        }

        .neutral {
            color: #d1d4dc;
        }

        .buy {
            color: #26a69a;
        }

        .sell {
            color: #ef5350;
        }

        .info {
            margin-top: 10px;
            font-size: 11px;
            line-height: 1.6;
            color: #787b86;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .side-panel {
                width: 220px;
            }

        }

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .side-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #2a2e39;
            }

            .chart-wrapper {
                height: 500px;
            }

        }

    </style>

</head>

<script>


/* =========================================
   ELEMENTS
========================================= */


const chartContainer =
    document.getElementById("chart");


const symbolSelector =
    document.getElementById("symbolSelector");


const statusElement =
    document.getElementById("status");


const stockName =
    document.querySelector(".stock-name");


const signalElement =
    document.getElementById("signal");


const signalInfo =
    document.getElementById("signalInfo");


/* =========================================
   CREATE CHART
========================================= */


const chart =
    LightweightCharts.createChart(
        chartContainer,
        {

            width:
                chartContainer.clientWidth,

            height:
                chartContainer.clientHeight,


            layout: {

                background: {
                    color: "#131722"
                },

                textColor:
                    "#d1d4dc"

            },


            grid: {

                vertLines: {
                    color: "#1e222d"
                },

                horzLines: {
                    color: "#1e222d"
                }

            },


            crosshair: {

                mode:
                    LightweightCharts
                        .CrosshairMode
                        .Normal

            },


            rightPriceScale: {

                borderColor:
                    "#2a2e39"

            },


            timeScale: {

                borderColor:
                    "#2a2e39",

                timeVisible:
                    true,

                secondsVisible:
                    false

            },


            handleScroll: {

                mouseWheel:
                    true,

                pressedMouseMove:
                    true

            },


            handleScale: {

                axisPressedMouseMove:
                    true,

                mouseWheel:
                    true,

                pinch:
                    true

            }

        }
    );


/* =========================================
   CANDLESTICK
========================================= */


const candleSeries =
    chart.addCandlestickSeries({

        upColor:
            "#26a69a",

        downColor:
            "#ef5350",

        borderVisible:
            false,

        wickUpColor:
            "#26a69a",

        wickDownColor:
            "#ef5350"

    });


/* =========================================
   VOLUME
========================================= */


const volumeSeries =
    chart.addHistogramSeries({

        priceFormat: {
            type: "volume"
        },

        priceScaleId: "",

        scaleMargins: {

            top: 0.80,

            bottom: 0

        }

    });


volumeSeries.applyOptions({
    visible: true
});


/* =========================================
   DATA
========================================= */


let rawData = [];


/* =========================================
   INDICATOR SERIES
========================================= */


let ema20Series = null;

let ema50Series = null;

let sma20Series = null;

let sma50Series = null;

let vwapSeries = null;

let bbUpperSeries = null;

let bbMiddleSeries = null;

let bbLowerSeries = null;


/* =========================================
   CREATE LINE
========================================= */


function createLineSeries() {

    return chart.addLineSeries({

        lineWidth: 2,

        priceLineVisible:
            false,

        lastValueVisible:
            false

    });

}


/* =========================================
   SMA
========================================= */


function calculateSMA(
    data,
    period
) {

    const result = [];

    let sum = 0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        sum +=
            data[i].close;


        if (i >= period) {

            sum -=
                data[i - period].close;

        }


        if (
            i >= period - 1
        ) {

            result.push({

                time:
                    data[i].time,

                value:
                    sum / period

            });

        }

    }


    return result;

}


/* =========================================
   EMA
========================================= */


function calculateEMA(
    data,
    period
) {

    const result = [];

    const multiplier =
        2 / (period + 1);

    let ema = null;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const close =
            data[i].close;


        if (ema === null) {

            ema = close;

        }

        else {

            ema =
                (close - ema) *
                multiplier +
                ema;

        }


        if (
            i >= period - 1
        ) {

            result.push({

                time:
                    data[i].time,

                value:
                    ema

            });

        }

    }


    return result;

}


/* =========================================
   VWAP
========================================= */


function calculateVWAP(data) {

    const result = [];

    let cumulativePV = 0;

    let cumulativeVolume = 0;


    for (
        const candle of data
    ) {

        const typicalPrice =
            (
                candle.high +
                candle.low +
                candle.close
            ) / 3;


        cumulativePV +=
            typicalPrice *
            candle.volume;


        cumulativeVolume +=
            candle.volume;


        if (
            cumulativeVolume > 0
        ) {

            result.push({

                time:
                    candle.time,

                value:
                    cumulativePV /
                    cumulativeVolume

            });

        }

    }


    return result;

}


/* =========================================
   BOLLINGER BANDS
========================================= */


function calculateBollingerBands(
    data,
    period = 20,
    multiplier = 2
) {

    const upper = [];

    const middle = [];

    const lower = [];


    for (
        let i = period - 1;
        i < data.length;
        i++
    ) {

        const values =
            data
                .slice(
                    i - period + 1,
                    i + 1
                )
                .map(
                    item =>
                        item.close
                );


        const mean =
            values.reduce(
                (a, b) =>
                    a + b,
                0
            ) / period;


        const variance =
            values.reduce(
                (sum, value) =>
                    sum +
                    Math.pow(
                        value - mean,
                        2
                    ),
                0
            ) / period;


        const standardDeviation =
            Math.sqrt(
                variance
            );


        upper.push({

            time:
                data[i].time,

            value:
                mean +
                multiplier *
                standardDeviation

        });


        middle.push({

            time:
                data[i].time,

            value:
                mean

        });


        lower.push({

            time:
                data[i].time,

            value:
                mean -
                multiplier *
                standardDeviation

        });

    }


    return {

        upper,

        middle,

        lower

    };

}


/* =========================================
   REMOVE SERIES
========================================= */


function removeSeries(series) {

    if (series) {

        chart.removeSeries(
            series
        );

    }

    return null;

}


/* =========================================
   INDICATOR BUTTON
========================================= */


function setIndicatorButton(
    id,
    enabled
) {

    const button =
        document.getElementById(id);


    button.textContent =
        enabled
            ? "ON"
            : "OFF";


    button.classList.toggle(
        "active",
        enabled
    );

}


/* =========================================
   EMA 20
========================================= */


function toggleEMA20() {

    if (!ema20Series) {

        ema20Series =
            createLineSeries();


        ema20Series.applyOptions({

            color:
                "#2962ff"

        });


        ema20Series.setData(

            calculateEMA(
                rawData,
                20
            )

        );


        setIndicatorButton(
            "ema20Button",
            true
        );

    }

    else {

        ema20Series =
            removeSeries(
                ema20Series
            );


        setIndicatorButton(
            "ema20Button",
            false
        );

    }

}

/* =========================================
   BOLLINGER BANDS
========================================= */


function toggleBollingerBands() {

    if (!bbUpperSeries) {

        const bands =
            calculateBollingerBands(
                rawData
            );


        bbUpperSeries =
            createLineSeries();


        bbMiddleSeries =
            createLineSeries();


        bbLowerSeries =
            createLineSeries();


        bbUpperSeries.applyOptions({

            color:
                "#f44336"

        });


        bbMiddleSeries.applyOptions({

            color:
                "#ffffff"

        });


        bbLowerSeries.applyOptions({

            color:
                "#f44336"

        });


        bbUpperSeries.setData(
            bands.upper
        );


        bbMiddleSeries.setData(
            bands.middle
        );


        bbLowerSeries.setData(
            bands.lower
        );


        setIndicatorButton(
            "bbButton",
            true
        );

    }

    else {

        bbUpperSeries =
            removeSeries(
                bbUpperSeries
            );


        bbMiddleSeries =
            removeSeries(

            );

            );

}


/* =========================================
   MARKET SIGNAL
========================================= */


function generateSignal() {

    if (
        rawData.length < 50
    ) {

        signalElement.textContent =
            "NEUTRAL";


        signalElement.className =
            "signal neutral";


        signalInfo.textContent =
            "Not enough data for signal calculation.";


        return;

    }


    const ema20 =
        calculateEMA(
            rawData,
            20
        );


    const ema50 =
        calculateEMA(
            rawData,
            50
        );


    const latest =
        rawData[
            rawData.length - 1
        ];


    const latestEMA20 =
        ema20[
            ema20.length - 1
        ].value;


    const latestEMA50 =
        ema50[
            ema50.length - 1
        ].value;


    let score = 0;


    if (
        latest.close >
        latestEMA20
    ) {

        score++;

    }


    if (
        latestEMA20 >
        latestEMA50
    ) {

        score++;

    }


    if (
        latest.close >
        latest.open
    ) {

        score++;

    }


    if (score >= 3) {

        signalElement.textContent =
            "BUY";


        signalElement.className =
            "signal buy";


        signalInfo.innerHTML =
            "EMA20 above EMA50<br>" +
            "Price above EMA20<br>" +
            "Positive latest candle";

    }

    else if (score === 0) {

        signalElement.textContent =
            "SELL";


        signalElement.className =
            "signal sell";


        signalInfo.innerHTML =
            "EMA20 below EMA50<br>" +
            "Price below EMA20<br>" +
            "Negative latest candle";

    }

    else {

        signalElement.textContent =
            "NEUTRAL";


        signalElement.className =
            "signal neutral";


        signalInfo.innerHTML =
            "Mixed indicator conditions<br>" +
            "Wait for confirmation";

    }

}


/* =========================================
   LOAD CANDLES
========================================= */


async function loadCandles(
    symbol,
    interval
) {

    statusElement.textContent =
        "Loading market data...";


    stockName.textContent =
        symbol;


    try {

        const response =
            await fetch(
                "/api/candles/" +
                encodeURIComponent(symbol) +
                "?interval=" +
                encodeURIComponent(interval)
            );


        if (!response.ok) {

            const error =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            throw new Error(
                error.detail ||
                "Unable to fetch market data"
            );

        }


        const data =
            await response.json();


        rawData = data;


        /* CANDLE */

        candleSeries.setData(
            data
        );


        /* VOLUME */

        const volumeData =
            data.map(
                candle => ({

                    time:
                        candle.time,

                    value:
                        candle.volume,

                    color:
                        candle.close >=
                        candle.open
                            ? "#26a69a"
                            : "#ef5350"

                })
            );


        volumeSeries.setData(
            volumeData
        );


        /* EMA 20 */

        if (ema20Series) {

            ema20Series.setData(

                calculateEMA(
                    data,
                    20
                )

            );

        }


        /* EMA 50 */

        if (ema50Series) {

            ema50Series.setData(

                calculateEMA(
                    data,
                    50
                )

            );

        }


        /* SMA 20 */

        if (sma20Series) {

            sma20Series.setData(

                calculateSMA(
                    data,
                    20
                )

            );

        }


        /* SMA 50 */

        if (sma50Series) {

            sma50Series.setData(

                calculateSMA(
                    data,
                    50
                )

            );

        }


        /* VWAP */

        if (vwapSeries) {

            vwapSeries.setData(

                calculateVWAP(
                    data
                )

            );

        }


        /* BOLLINGER */

        if (bbUpperSeries) {

            const bands =
                calculateBollingerBands(
                    data
                );


            bbUpperSeries.setData(
                bands.upper
            );


            bbMiddleSeries.setData(
                bands.middle
            );


            bbLowerSeries.setData(
                bands.lower
            );

        }


        /* AUTO FIT */

        chart.timeScale()
            .fitContent();


        statusElement.textContent =
            data.length +
            " candles • " +
            interval.toUpperCase();


        generateSignal();

    }

    catch (error) {

        console.error(error);


        statusElement.textContent =
            "Error: " +
            error.message;


        rawData = [];

    }

}


/* =========================================
   INDICATOR EVENTS
========================================= */


document
    .getElementById("ema20Button")
    .addEventListener(
        "click",
        toggleEMA20
    );


document
    .getElementById("ema50Button")
    .addEventListener(
        "click",
        toggleEMA50
    );


document
    .getElementById("sma20Button")
    .addEventListener(
        "click",
        toggleSMA20
    );


document
    .getElementById("sma50Button")
    .addEventListener(
        "click",
        toggleSMA50
    );


document
    .getElementById("vwapButton")
    .addEventListener(
        "click",
        toggleVWAP
    );


document
    .getElementById("bbButton")
    .addEventListener(
        "click",
        toggleBollingerBands
    );


/* =========================================
   VOLUME BUTTON
========================================= */


document
    .getElementById("volumeButton")
    .addEventListener(
        "click",
        function () {

            const currentlyVisible =
                this.textContent === "ON";


            volumeSeries.applyOptions({

                visible:
                    !currentlyVisible

            });


            setIndicatorButton(
                "volumeButton",
                !currentlyVisible
            );

        }
    );


/* =========================================
   AUTO FIT
========================================= */


document
    .getElementById("fitButton")
    .addEventListener(
        "click",
        function () {

            chart.timeScale()
                .fitContent();

        }
    );


/* =========================================
   TIMEFRAME BUTTONS
========================================= */


document
    .querySelectorAll(".timeframe")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {


                    /* REMOVE ACTIVE */

                    document
                        .querySelectorAll(
                            ".timeframe"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    /* ADD ACTIVE */

                    this.classList.add(
                        "active"
                    );


                    /* LOAD NEW TIMEFRAME */

                    loadCandles(
                        symbolSelector.value,
                        this.dataset.interval
                    );

                }
            );

        }
    );


/* =========================================
   SYMBOL CHANGE
========================================= */


symbolSelector.addEventListener(
    "change",
    function () {

        const activeButton =
            document.querySelector(
                ".timeframe.active"
            );


        loadCandles(
            this.value,
            activeButton
                ? activeButton.dataset.interval
                : "5m"
        );

    }
);


/* =========================================
   WINDOW RESIZE
========================================= */


window.addEventListener(
    "resize",
    function () {

        chart.applyOptions({

            width:
                chartContainer.clientWidth,

            height:
                chartContainer.clientHeight

        });

    }
);


/* =========================================
   INITIAL LOAD
   DEFAULT = 5 MINUTE
========================================= */


loadCandles(
    "RELIANCE.NS",
    "5m"
);


</script>


</body>

</html>
