<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            color: #d1d4dc;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            min-height: 58px;
            width: 100%;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 15px;

            overflow-x: auto;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-right: 10px;
            white-space: nowrap;
        }

        select,
        button {
            background: #131722;
            color: #d1d4dc;
            border: 1px solid #363a45;
            border-radius: 4px;
            padding: 8px 11px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {

        }

        button.active {

            color: #ffffff;

        }

        }

            font-size: 12px;

            white-space: nowrap;
        }

           MAIN LAYOUT
        ========================= */

            display: flex;
            width: 100%;

            flex: 1;
            min-width: 0;
            padding: 12px;
        }

           CHART HEADER
        ========================= */

            height: 42px;

           CHART
        ========================= */

           SIDE PANEL

            background: #1e222d;
            border-left: 1px solid #2a2e39;

        }

        .indicator span {

        }

        .indicator button {
            padding: 5px 9px;

        /* =========================
           SIGNAL
        ========================= */

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const chartContainer =
    document.getElementById("chart");

const symbolSelector =
    document.getElementById("symbolSelector");

const statusElement =
    document.getElementById("status");

const stockName =
    document.querySelector(".stock-name");

const signalElement =
    document.getElementById("signal");

const signalInfo =
    document.getElementById("signalInfo");


/* =====================================================
   CHART
===================================================== */

const chart =
    LightweightCharts.createChart(
        chartContainer,
        {

            width:
                chartContainer.clientWidth,

            height:
                chartContainer.clientHeight,

            layout: {

                background: {
                    color: "#131722"
                },

                textColor:
                    "#d1d4dc"

            },

            grid: {

                vertLines: {
                    color: "#1e222d"
                },

                horzLines: {
                    color: "#1e222d"
                }

            },

            crosshair: {

                mode:
                    LightweightCharts
                        .CrosshairMode
                        .Normal

            },

            rightPriceScale: {

                borderColor:
                    "#2a2e39"

            },

            timeScale: {

                borderColor:
                    "#2a2e39",

                timeVisible:
                    true,

                secondsVisible:
                    false

            },

            handleScroll: {

                mouseWheel:
                    true,

                pressedMouseMove:
                    true

            },

            handleScale: {

                axisPressedMouseMove:
                    true,

                mouseWheel:
                    true,

                pinch:
                    true

            }

        }
    );


/* =====================================================
   CHART SERIES
===================================================== */

let candleSeries = null;

let lineSeries = null;

let areaSeries = null;


/* Current chart type */

let currentChartType =
    "candlestick";


/* =====================================================
   CREATE CANDLE
===================================================== */

function createCandleSeries() {

    candleSeries =
        chart.addCandlestickSeries({

            upColor:
                "#26a69a",

            downColor:
                "#ef5350",

            borderVisible:
                false,

            wickUpColor:
                "#26a69a",

            wickDownColor:
                "#ef5350"

        });

}


/* =====================================================
   CREATE LINE
===================================================== */

function createLineSeriesForChart() {

    lineSeries =
        chart.addLineSeries({

            color:
                "#2962ff",

            lineWidth:
                2,

            priceLineVisible:
                false,

            lastValueVisible:
                true

        });

}


/* =====================================================
   CREATE AREA
===================================================== */

function createAreaSeries() {

    areaSeries =
        chart.addAreaSeries({

            lineColor:
                "#2962ff",

            topColor:
                "rgba(41, 98, 255, 0.35)",

            bottomColor:
                "rgba(41, 98, 255, 0.03)",

            lineWidth:
                2,

            priceLineVisible:
                false,

            lastValueVisible:
                true

        });

}


/* =====================================================
   CREATE INITIAL CHART
===================================================== */

createCandleSeries();


/* =====================================================
   VOLUME
===================================================== */

const volumeSeries =
    chart.addHistogramSeries({

        priceFormat: {

            type:
                "volume"

        },

        priceScaleId:
            "",

        scaleMargins: {

            top:
                0.80,

            bottom:
                0

        }

    });


volumeSeries.applyOptions({

    visible:
        true

});


/* =====================================================
   DATA
===================================================== */

let rawData = [];


/* =====================================================
   INDICATORS
===================================================== */

let ema20Series = null;

let ema50Series = null;

let sma20Series = null;

let sma50Series = null;

let vwapSeries = null;

let bbUpperSeries = null;

let bbMiddleSeries = null;

let bbLowerSeries = null;


/* =====================================================
   CREATE INDICATOR LINE
===================================================== */

function createIndicatorLine() {

    return chart.addLineSeries({

        lineWidth:
            2,

        priceLineVisible:
            false,

        lastValueVisible:
            false

    });

}


/* =====================================================
   SMA
===================================================== */

function calculateSMA(
    data,
    period
) {

    const result = [];

    let sum = 0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        sum +=
            data[i].close;


        if (i >= period) {

            sum -=
                data[i - period].close;

        }


        if (
            i >= period - 1
        ) {

            result.push({

                time:
                    data[i].time,

                value:
                    sum / period

            });

        }

    }


    return result;

}


/* =====================================================
   EMA
===================================================== */

function calculateEMA(
    data,
    period
) {

    const result = [];

    const multiplier =
        2 / (period + 1);

    let ema = null;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const close =
            data[i].close;


        if (ema === null) {

            ema =
                close;

        }

        else {

            ema =
                (close - ema) *
                multiplier +
                ema;

        }


        if (
            i >= period - 1
        ) {

            result.push({

                time:
                    data[i].time,

                value:
                    ema

            });

        }

    }


    return result;

}


/* =====================================================
   VWAP
===================================================== */

function calculateVWAP(data) {

    const result = [];

    let cumulativePV = 0;

    let cumulativeVolume = 0;


    for (
        const candle of data
    ) {

        const typicalPrice =
            (
                candle.high +
                candle.low +
                candle.close
            ) / 3;


        cumulativePV +=
            typicalPrice *
            candle.volume;


        cumulativeVolume +=
            candle.volume;


        if (
            cumulativeVolume > 0
        ) {

            result.push({

                time:
                    candle.time,

                value:
                    cumulativePV /
                    cumulativeVolume

            });

        }

    }


    return result;

}


/* =====================================================
   BOLLINGER BANDS
===================================================== */

function calculateBollingerBands(
    data,
    period = 20,
    multiplier = 2
) {

    const upper = [];

    const middle = [];

    const lower = [];


    for (
        let i = period - 1;
        i < data.length;
        i++
    ) {

        const values =
            data
                .slice(
                    i - period + 1,
                    i + 1
                )
                .map(
                    item =>
                        item.close
                );


        const mean =
            values.reduce(
                (a, b) =>
                    a + b,
                0
            ) / period;


        const variance =
            values.reduce(
                (sum, value) =>
                    sum +
                    Math.pow(
                        value - mean,
                        2
                    ),
                0
            ) / period;


        const standardDeviation =
            Math.sqrt(
                variance
            );


        upper.push({

            time:
                data[i].time,

            value:
                mean +
                multiplier *
                standardDeviation

        });


        middle.push({

            time:
                data[i].time,

            value:
                mean

        });


        lower.push({

            time:
                data[i].time,

            value:
                mean -
                multiplier *
                standardDeviation

        });

    }


    return {

        upper,
        middle,
        lower

    };

}


/* =====================================================
   CHART TYPE DATA
===================================================== */

function getLineData(data) {

    return data.map(
        candle => ({

            time:
                candle.time,

            value:
                candle.close

        })
    );

}


/* =====================================================
   CHANGE CHART TYPE
===================================================== */

function changeChartType(type) {

    currentChartType =
        type;


    /* Remove existing main chart */

    if (candleSeries) {

        chart.removeSeries(
            candleSeries
        );

        candleSeries =
            null;

    }


    if (lineSeries) {

        chart.removeSeries(
            lineSeries
        );

        lineSeries =
            null;

    }


    if (areaSeries) {

        chart.removeSeries(
            areaSeries
        );

        areaSeries =
            null;

    }


    /* CANDLE */

    if (
        type ===
        "candlestick"
    ) {

        createCandleSeries();

        candleSeries.setData(
            rawData
        );

    }


    /* LINE */

    else if (
        type === "line"
    ) {

        createLineSeriesForChart();

        lineSeries.setData(
            getLineData(
                rawData
            )
        );

    }


    /* AREA */

    else if (
        type === "area"
    ) {

        createAreaSeries();

        areaSeries.setData(
            getLineData(
                rawData
            )
        );

    }


    chart.timeScale()
        .fitContent();

}


/* =====================================================
   REMOVE SERIES
===================================================== */

function removeSeries(series) {

    if (series) {

        chart.removeSeries(
            series
        );

    }

    return null;

}


/* =====================================================
   BUTTON STATE
===================================================== */

function setIndicatorButton(
    id,
    enabled
) {

    const button =
        document.getElementById(
            id
        );


    button.textContent =
        enabled
            ? "ON"
            : "OFF";


    button.classList.toggle(
        "active",
        enabled
    );

}


/* =====================================================
   EMA 20
===================================================== */

function toggleEMA20() {

    if (!ema20Series) {

        ema20Series =
            createIndicatorLine();


        ema20Series.applyOptions({

            color:
                "#2962ff"

        });


        ema20Series.setData(

        );

}

function toggleVWAP() {

/* =====================================================
   BOLLINGER
===================================================== */

function toggleBollingerBands() {

    if (!bbUpperSeries) {

        const bands =
            calculateBollingerBands(
                rawData
            );


        bbUpperSeries =
            createIndicatorLine();


        bbMiddleSeries =
            createIndicatorLine();


        bbLowerSeries =
            createIndicatorLine();


        bbUpperSeries.applyOptions({

            color:

        });


        bbMiddleSeries.applyOptions({

        });


        bbLowerSeries.applyOptions({

        });


        bbUpperSeries.setData(
            bands.upper
        );


        bbMiddleSeries.setData(
            bands.middle
        );


        bbLowerSeries.setData(
            bands.lower
        );


        setIndicatorButton(

        );

    }

    else {

        bbUpperSeries =
            removeSeries(
                bbUpperSeries
            );


        bbMiddleSeries =
            removeSeries(

            );


        bbLowerSeries =

                bbLowerSeries
            );


        setIndicatorButton(
            "bbButton",
            false
        );

    }

}


/* =====================================================
   MARKET SIGNAL
===================================================== */

function generateSignal() {

    if (
        rawData.length < 50
    ) {

        signalElement.textContent =
            "NEUTRAL";


        signalElement.className =
            "signal neutral";


        signalInfo.textContent =
            "Not enough data for signal calculation.";

        return;

    }


    const ema20 =
        calculateEMA(
            rawData,
            20
        );


    const ema50 =
        calculateEMA(
            rawData,
            50
        );


    const latest =
        rawData[
            rawData.length - 1
        ];


    const latestEMA20 =
        ema20[
            ema20.length - 1
        ].value;


    const latestEMA50 =
        ema50[
            ema50.length - 1
        ].value;


    let score = 0;


    if (
        latest.close >
        latestEMA20
    ) {

        score++;

    }


    if (
        latestEMA20 >
        latestEMA50
    ) {

        score++;

    }


    if (
        latest.close >
        latest.open
    ) {

        score++;

    }


    if (score >= 3) {

        signalElement.textContent =
            "BUY";


        signalElement.className =
            "signal buy";


        signalInfo.innerHTML =
            "EMA20 above EMA50<br>" +
            "Price above EMA20<br>" +
            "Positive latest candle";

    }

    else if (score === 0) {

        signalElement.textContent =
            "SELL";


        signalElement.className =
            "signal sell";


        signalInfo.innerHTML =
            "EMA20 below EMA50<br>" +
            "Price below EMA20<br>" +
            "Negative latest candle";

    }

    else {

        signalElement.textContent =
            "NEUTRAL";


        signalElement.className =
            "signal neutral";


        signalInfo.innerHTML =
            "Mixed indicator conditions<br>" +
            "Wait for confirmation";

    }

}


/* =====================================================
   LOAD CANDLES
===================================================== */

async function loadCandles(
    symbol,
    interval
) {

    statusElement.textContent =
        "Loading market data...";


    stockName.textContent =
        symbol;


    try {

        const response =
            await fetch(
                "/api/candles/" +
                encodeURIComponent(symbol) +
                "?interval=" +
                encodeURIComponent(interval)
            );


        if (!response.ok) {

            const error =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            throw new Error(
                error.detail ||
                "Unable to fetch market data"
            );

        }


        const data =
            await response.json();


        rawData =
            data;


        /* Main chart */

        if (
            currentChartType ===
            "candlestick"
        ) {

            if (!candleSeries) {

                createCandleSeries();

            }

            candleSeries.setData(
                data
            );

        }

        else if (
            currentChartType ===
            "line"
        ) {

            if (!lineSeries) {

                createLineSeriesForChart();

            }

            lineSeries.setData(
                getLineData(data)
            );

        }

        else if (
            currentChartType ===
            "area"
        ) {

            if (!areaSeries) {

                createAreaSeries();

            }

            areaSeries.setData(
                getLineData(data)
            );

        }


        /* Volume */

        const volumeData =
            data.map(
                candle => ({

                    time:
                        candle.time,

                    value:
                        candle.volume,

                    color:
                        candle.close >=
                        candle.open
                            ? "#26a69a"
                            : "#ef5350"

                })
            );


        volumeSeries.setData(
            volumeData
        );


        /* EMA 20 */

        if (ema20Series) {

            ema20Series.setData(

                calculateEMA(
                    data,
                    20
                )

            );

        }


        /* EMA 50 */

        if (ema50Series) {

            ema50Series.setData(

                calculateEMA(
                    data,
                    50
                )

            );

        }


        /* SMA 20 */

        if (sma20Series) {

            sma20Series.setData(

                calculateSMA(
                    data,
                    20
                )

            );

        }


        /* SMA 50 */

        if (sma50Series) {

            sma50Series.setData(

                calculateSMA(
                    data,
                    50
                )

            );

        }


        /* VWAP */

        if (vwapSeries) {

            vwapSeries.setData(

                calculateVWAP(
                    data
                )

            );

        }


        /* Bollinger */

        if (bbUpperSeries) {

            const bands =
                calculateBollingerBands(
                    data
                );


            bbUpperSeries.setData(
                bands.upper
            );


            bbMiddleSeries.setData(
                bands.middle
            );


            bbLowerSeries.setData(
                bands.lower
            );

        }


        /* Auto Fit */

        chart.timeScale()
            .fitContent();


        statusElement.textContent =
            data.length +
            " candles • " +
            interval.toUpperCase();


        generateSignal();

    }

    catch (error) {

        console.error(error);


        statusElement.textContent =
            "Error: " +
            error.message;


        rawData = [];

    }

}

===================================================== */

document
    .getElementById("volumeButton")
    .addEventListener(
        "click",
        function () {

            const currentlyVisible =
                this.textContent === "ON";


            volumeSeries.applyOptions({

                visible:
                    !currentlyVisible

            });


            setIndicatorButton(
                "volumeButton",
                !currentlyVisible
            );

        }
    );


/* =====================================================
   AUTO FIT
===================================================== */

document
    .getElementById("fitButton")
    .addEventListener(
        "click",
        function () {

            chart.timeScale()
                .fitContent();

        }
    );


/* =====================================================
   TIMEFRAME
===================================================== */

document
    .querySelectorAll(".timeframe")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {


                    document
                        .querySelectorAll(
                            ".timeframe"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    loadCandles(
                        symbolSelector.value,
                        this.dataset.interval
                    );

                }
            );

        }
    );


/* =====================================================
   CHART TYPE
===================================================== */

document
    .querySelectorAll(".chart-type")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {


                    document
                        .querySelectorAll(
                            ".chart-type"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    changeChartType(
                        this.dataset.type
                    );

                }
            );

        }
    );


/* =====================================================
   SYMBOL
===================================================== */

symbolSelector.addEventListener(
    "change",
    function () {

        const activeButton =
            document.querySelector(
                ".timeframe.active"
            );


        loadCandles(
            this.value,
            activeButton
                ? activeButton.dataset.interval
                : "5m"
        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function () {

        chart.applyOptions({

            width:
                chartContainer.clientWidth,

            height:
                chartContainer.clientHeight

        });

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadCandles(
    "RELIANCE.NS",
    "5m"
);


</script>
