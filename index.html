<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradePro - Professional Trading Platform</title>

    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f111a;
            color: #e8eaf0;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* ================= TOP BAR ================= */

        .topbar {
            height: 58px;
            background: #1b1f2a;
            border-bottom: 1px solid #2a2f3b;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            white-space: nowrap;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            margin-right: 12px;
        }

        select,
        button {
            background: #171b25;
            color: #e8eaf0;
            border: 1px solid #343a48;
            border-radius: 4px;
            height: 34px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
        }

        select {
            min-width: 150px;
        }

        button:hover {
            background: #252b38;
        }

        button.active {
            background: #2962ff;
            border-color: #2962ff;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .toolbar-label {
            color: #737b8d;
            font-size: 12px;
            margin-left: 4px;
        }

        /* ================= MAIN ================= */

        .main {
            display: flex;
            height: calc(100vh - 58px);
        }

        .chart-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            height: 54px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .symbol-title {
            font-size: 16px;
            font-weight: bold;
        }

        .candle-info {
            color: #7d8597;
            font-size: 12px;
        }

        #chart {
            flex: 1;
            min-height: 0;
            position: relative;
            margin: 0 12px 12px 12px;
            border: 1px solid #252b36;
            background: #11151f;
        }

        /* ================= RIGHT PANEL ================= */

        .sidebar {
            width: 274px;
            background: #171b25;
            border-left: 1px solid #2b303c;
            overflow-y: auto;
            padding: 14px;
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .indicator-card {
            height: 54px;
            border: 1px solid #292f3b;
            background: #191e28;
            border-radius: 5px;
            margin-bottom: 8px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .indicator-name {
            font-size: 13px;
        }

        .toggle {
            min-width: 42px;
            height: 26px;
            padding: 0 8px;
            font-size: 11px;
        }

        .toggle.on {
            background: #2962ff;
            border-color: #2962ff;
        }

        /* ================= SIGNAL ================= */

        .signal-box {
            margin-top: 14px;
            border: 1px solid #303644;
            border-radius: 5px;
            padding: 15px;
            background: #191e28;
        }

        .signal-label {
            color: #727b8e;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .signal-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .signal-value.buy {
            color: #26a69a;
        }

        .signal-value.sell {
            color: #ef5350;
        }

        .signal-value.neutral {
            color: #e0a84c;
        }

        .signal-reason {
            color: #8a92a4;
            font-size: 12px;
            line-height: 1.5;
        }

        .error-box {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            padding: 12px;
            background: #351c20;
            border: 1px solid #8b343d;
            color: #ff8a93;
            border-radius: 5px;
            display: none;
            z-index: 20;
            font-size: 13px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {
            .sidebar {
                width: 230px;
            }

            .logo {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- ================= TOP BAR ================= -->

<div class="topbar">

    <div class="logo">
        TradePro
    </div>

    <select id="symbolSelect">
        <option value="RELIANCE.NS">RELIANCE.NS</option>
        <option value="TCS.NS">TCS.NS</option>
        <option value="INFY.NS">INFY.NS</option>
    </select>

    <button class="timeframe" data-interval="1m">
        1m
    </button>

    <button class="timeframe active" data-interval="5m">
        5m
    </button>

    <button class="timeframe" data-interval="15m">
        15m
    </button>

    <button class="timeframe" data-interval="30m">
        30m
    </button>

    <button class="timeframe" data-interval="1h">
        1H
    </button>

    <button class="timeframe" data-interval="4h">
        4H
    </button>

    <button class="timeframe" data-interval="1d">
        1D
    </button>

    <button id="fitButton">
        Auto Fit
    </button>

    <button id="resetButton">
        Reset
    </button>

    <button id="fullscreenButton">
        ⛶ Fullscreen
    </button>

    <span class="toolbar-label">
        Chart:
    </span>

    <button id="candleButton" class="active">
        🕯 Candle
    </button>

    <button id="lineButton">
        ━ Line
    </button>

    <button id="areaButton">
        ▰ Area
    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <div class="chart-area">

        <div class="chart-header">

            <div class="symbol-title" id="symbolTitle">
                RELIANCE.NS
            </div>

            <div class="candle-info" id="candleInfo">
                Loading...
            </div>

        </div>

        <div id="chart">

            <div id="errorBox" class="error-box"></div>

        </div>

    </div>


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="sidebar-title">
            Indicators
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                Volume
            </span>

            <button id="volumeToggle" class="toggle on">
                ON
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                EMA 20
            </span>

            <button class="toggle" data-indicator="ema20">
                OFF
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                EMA 50
            </span>

            <button class="toggle" data-indicator="ema50">
                OFF
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                SMA 20
            </span>

            <button class="toggle" data-indicator="sma20">
                OFF
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                SMA 50
            </span>

            <button class="toggle" data-indicator="sma50">
                OFF
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                VWAP
            </span>

            <button class="toggle" data-indicator="vwap">
                OFF
            </button>
        </div>


        <div class="indicator-card">
            <span class="indicator-name">
                Bollinger Bands
            </span>

            <button class="toggle" data-indicator="bb">
                OFF
            </button>
        </div>


        <!-- ================= SIGNAL ================= -->

        <div class="signal-box">

            <div class="signal-label">
                MARKET SIGNAL
            </div>

            <div id="signalValue"
                 class="signal-value neutral">
                NEUTRAL
            </div>

            <div id="signalReason"
                 class="signal-reason">
                Loading market conditions...
            </div>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let chart;
    let candleSeries;
    let lineSeries;
    let areaSeries;
    let volumeSeries;

    let ema20Series;
    let ema50Series;
    let sma20Series;
    let sma50Series;
    let vwapSeries;

    let bbUpperSeries;
    let bbMiddleSeries;
    let bbLowerSeries;

    let currentData = [];
    let currentInterval = "5m";
    let currentSymbol = "RELIANCE.NS";
    let currentChartType = "candle";


    /* =====================================================
       CHART CREATION
    ===================================================== */

    function createChart() {

        const container = document.getElementById("chart");

        chart = LightweightCharts.createChart(container, {

            layout: {
                background: {
                    color: "#11151f"
                },

                textColor: "#aab1c0"
            },

            grid: {

                vertLines: {
                    color: "#202532"
                },

                horzLines: {
                    color: "#202532"
                }

            },

            crosshair: {

                mode: LightweightCharts.CrosshairMode.Normal

            },

            rightPriceScale: {

                borderColor: "#303642"

            },

            timeScale: {

                borderColor: "#303642",

                timeVisible: true,

                secondsVisible: false

            },

            handleScroll: true,

            handleScale: true

        });


        candleSeries = chart.addCandlestickSeries({

            upColor: "#26a69a",

            downColor: "#ef5350",

            borderVisible: false,

            wickUpColor: "#26a69a",

            wickDownColor: "#ef5350"

        });


        lineSeries = chart.addLineSeries({

            color: "#2962ff",

            lineWidth: 2,

            visible: false

        });


        areaSeries = chart.addAreaSeries({

            lineColor: "#2962ff",

            topColor: "rgba(41,98,255,0.30)",

            bottomColor: "rgba(41,98,255,0.02)",

            lineWidth: 2,

            visible: false

        });


        volumeSeries = chart.addHistogramSeries({

            priceFormat: {
                type: "volume"
            },

            priceScaleId: "",

            scaleMargins: {

                top: 0.85,

                bottom: 0

            }

        });


        chart.priceScale("").applyOptions({

            scaleMargins: {

                top: 0.85,

                bottom: 0

            }

        });


        /* INDICATOR SERIES */

        ema20Series = chart.addLineSeries({
            color: "#42a5f5",
            lineWidth: 2,
            visible: false
        });


        ema50Series = chart.addLineSeries({
            color: "#ffca28",
            lineWidth: 2,
            visible: false
        });


        sma20Series = chart.addLineSeries({
            color: "#ab47bc",
            lineWidth: 2,
            visible: false
        });


        sma50Series = chart.addLineSeries({
            color: "#ef6c00",
            lineWidth: 2,
            visible: false
        });


        vwapSeries = chart.addLineSeries({
            color: "#00bcd4",
            lineWidth: 2,
            visible: false
        });


        bbUpperSeries = chart.addLineSeries({
            color: "#78909c",
            lineWidth: 1,
            visible: false
        });


        bbMiddleSeries = chart.addLineSeries({
            color: "#90a4ae",
            lineWidth: 1,
            visible: false
        });


        bbLowerSeries = chart.addLineSeries({
            color: "#78909c",
            lineWidth: 1,
            visible: false
        });


        resizeChart();

        window.addEventListener("resize", resizeChart);
    }


    /* =====================================================
       RESIZE
    ===================================================== */

    function resizeChart() {

        if (!chart) return;

        const container = document.getElementById("chart");

        chart.applyOptions({

            width: container.clientWidth,

            height: container.clientHeight

        });

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadData() {

        hideError();

        currentSymbol =
            document.getElementById("symbolSelect").value;

        document.getElementById("symbolTitle").textContent =
            currentSymbol;

        document.getElementById("candleInfo").textContent =
            "Loading...";


        try {

            const url =
                `/api/candles/${encodeURIComponent(currentSymbol)}?interval=${currentInterval}`;


            const response = await fetch(url);


            if (!response.ok) {

                const errorData = await response.json()
                    .catch(() => ({}));

                throw new Error(
                    errorData.detail ||
                    `Server error: ${response.status}`
                );

            }


            const data = await response.json();


            if (!Array.isArray(data) || data.length === 0) {

                throw new Error(
                    "No market data available"
                );

            }


            currentData = cleanData(data);


            drawChart();


            document.getElementById("candleInfo").textContent =
                `${currentData.length} candles • ${currentInterval.toUpperCase()}`;


            updateSignal();


        } catch (error) {

            console.error(error);

            showError(
                `Unable to load ${currentSymbol} ${currentInterval.toUpperCase()}: ${error.message}`
            );

            document.getElementById("candleInfo").textContent =
                "Data unavailable";

        }

    }


    /* =====================================================
       CLEAN DATA
    ===================================================== */

    function cleanData(data) {

        const result = [];

        const seen = new Set();


        for (const item of data) {

            if (
                item.time === undefined ||
                item.open === undefined ||
                item.high === undefined ||
                item.low === undefined ||
                item.close === undefined
            ) {
                continue;
            }


            const key = String(item.time);

            if (seen.has(key)) {
                continue;
            }

            seen.add(key);


            const candle = {

                time: item.time,

                open: Number(item.open),

                high: Number(item.high),

                low: Number(item.low),

                close: Number(item.close),

                volume: Number(item.volume || 0)

            };


            if (
                !Number.isFinite(candle.open) ||
                !Number.isFinite(candle.high) ||
                !Number.isFinite(candle.low) ||
                !Number.isFinite(candle.close)
            ) {
                continue;
            }


            result.push(candle);

        }


        result.sort((a, b) => {

            if (typeof a.time === "string") {

                return a.time.localeCompare(b.time);

            }

            return a.time - b.time;

        });


        return result;

    }


    /* =====================================================
       DRAW CHART
    ===================================================== */

    function drawChart() {

        if (!currentData.length) return;


        const candleData =
            currentData.map(x => ({

                time: x.time,

                open: x.open,

                high: x.high,

                low: x.low,

                close: x.close

            }));


        const closeData =
            currentData.map(x => ({

                time: x.time,

                value: x.close

            }));


        const volumeData =
            currentData.map(x => ({

                time: x.time,

                value: x.volume,

                color:
                    x.close >= x.open
                        ? "rgba(38,166,154,0.65)"
                        : "rgba(239,83,80,0.65)"

            }));


        /* MAIN CHART */

        candleSeries.setData(candleData);

        lineSeries.setData(closeData);

        areaSeries.setData(closeData);

        volumeSeries.setData(volumeData);


        /* INDICATORS */

        ema20Series.setData(
            calculateEMA(currentData, 20)
        );

        ema50Series.setData(
            calculateEMA(currentData, 50)
        );

        sma20Series.setData(
            calculateSMA(currentData, 20)
        );

        sma50Series.setData(
            calculateSMA(currentData, 50)
        );

        vwapSeries.setData(
            calculateVWAP(currentData)
        );


        const bb =
            calculateBollingerBands(currentData, 20, 2);


        bbUpperSeries.setData(bb.upper);

        bbMiddleSeries.setData(bb.middle);

        bbLowerSeries.setData(bb.lower);


        /* FIT */

        chart.timeScale().fitContent();

    }


    /* =====================================================
       EMA
    ===================================================== */

    function calculateEMA(data, period) {

        const result = [];

        if (data.length < period) {
            return result;
        }


        const multiplier =
            2 / (period + 1);


        let ema = 0;


        for (let i = 0; i < period; i++) {

            ema += data[i].close;

        }


        ema /= period;


        result.push({

            time: data[period - 1].time,

            value: ema

        });


        for (
            let i = period;
            i < data.length;
            i++
        ) {

            ema =
                ((data[i].close - ema) * multiplier)
                + ema;


            result.push({

                time: data[i].time,

                value: ema

            });

        }


        return result;

    }


    /* =====================================================
       SMA
    ===================================================== */

    function calculateSMA(data, period) {

        const result = [];


        if (data.length < period) {
            return result;
        }


        let sum = 0;


        for (let i = 0; i < data.length; i++) {

            sum += data[i].close;


            if (i >= period) {

                sum -= data[i - period].close;

            }


            if (i >= period - 1) {

                result.push({

                    time: data[i].time,

                    value: sum / period

                });

            }

        }


        return result;

    }


    /* =====================================================
       VWAP
    ===================================================== */

    function calculateVWAP(data) {

        const result = [];

        let cumulativePV = 0;

        let cumulativeVolume = 0;


        for (const candle of data) {

            const typicalPrice =
                (
                    candle.high +
                    candle.low +
                    candle.close
                ) / 3;


            cumulativePV +=
                typicalPrice * candle.volume;


            cumulativeVolume +=
                candle.volume;


            const value =
                cumulativeVolume > 0
                    ? cumulativePV / cumulativeVolume
                    : typicalPrice;


            result.push({

                time: candle.time,

                value: value

            });

        }


        return result;

    }


    /* =====================================================
       BOLLINGER BANDS
    ===================================================== */

    function calculateBollingerBands(
        data,
        period,
        multiplier
    ) {

        const upper = [];

        const middle = [];

        const lower = [];


        if (data.length < period) {

            return {
                upper,
                middle,
                lower
            };

        }


        for (
            let i = period - 1;
            i < data.length;
            i++
        ) {

            let sum = 0;


            for (
                let j = i - period + 1;
                j <= i;
                j++
            ) {

                sum += data[j].close;

            }


            const mean =
                sum / period;


            let variance = 0;


            for (
                let j = i - period + 1;
                j <= i;
                j++
            ) {

                variance +=
                    Math.pow(
                        data[j].close - mean,
                        2
                    );

            }


            const standardDeviation =
                Math.sqrt(
                    variance / period
                );


            upper.push({

                time: data[i].time,

                value:
                    mean +
                    multiplier * standardDeviation

            });


            middle.push({

                time: data[i].time,

                value: mean

            });


            lower.push({

                time: data[i].time,

                value:
                    mean -
                    multiplier * standardDeviation

            });

        }


        return {
            upper,
            middle,
            lower
        };

    }


    /* =====================================================
       CHART TYPE
    ===================================================== */

    function setChartType(type) {

        currentChartType = type;


        candleSeries.applyOptions({

            visible: type === "candle"

        });


        lineSeries.applyOptions({

            visible: type === "line"

        });


        areaSeries.applyOptions({

            visible: type === "area"

        });


        document
            .getElementById("candleButton")
            .classList.toggle(
                "active",
                type === "candle"
            );


        document
            .getElementById("lineButton")
            .classList.toggle(
                "active",
                type === "line"
            );


        document
            .getElementById("areaButton")
            .classList.toggle(
                "active",
                type === "area"
            );

    }


    /* =====================================================
       INDICATOR TOGGLES
    ===================================================== */

    document
        .querySelectorAll("[data-indicator]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const indicator =
                    button.dataset.indicator;


                const isOn =
                    button.textContent.trim() === "ON";


                button.textContent =
                    isOn ? "OFF" : "ON";


                button.classList.toggle(
                    "on",
                    !isOn
                );


                switch (indicator) {

                    case "ema20":

                        ema20Series.applyOptions({
                            visible: !isOn
                        });

                        break;


                    case "ema50":

                        ema50Series.applyOptions({
                            visible: !isOn
                        });

                        break;


                    case "sma20":

                        sma20Series.applyOptions({
                            visible: !isOn
                        });

                        break;


                    case "sma50":

                        sma50Series.applyOptions({
                            visible: !isOn
                        });

                        break;


                    case "vwap":

                        vwapSeries.applyOptions({
                            visible: !isOn
                        });

                        break;


                    case "bb":

                        bbUpperSeries.applyOptions({
                            visible: !isOn
                        });

                        bbMiddleSeries.applyOptions({
                            visible: !isOn
                        });

                        bbLowerSeries.applyOptions({
                            visible: !isOn
                        });

                        break;

                }

            });

        });


    /* =====================================================
       VOLUME
    ===================================================== */

    document
        .getElementById("volumeToggle")
        .addEventListener("click", function () {

            const isOn =
                this.textContent.trim() === "ON";


            this.textContent =
                isOn ? "OFF" : "ON";


            this.classList.toggle(
                "on",
                !isOn
            );


            volumeSeries.applyOptions({

                visible: !isOn

            });

        });


    /* =====================================================
       TIMEFRAME
    ===================================================== */

    document
        .querySelectorAll(".timeframe")
        .forEach(button => {

            button.addEventListener("click", () => {

                const interval =
                    button.dataset.interval;


                /*
                   Current main.py supports:
                   5m
                   15m
                   1h
                   1d

                   1m / 30m / 4h will be enabled
                   after backend support is added.
                */

                const supported =
                    [
                        "5m",
                        "15m",
                        "1h",
                        "1d"
                    ];


                if (!supported.includes(interval)) {

                    showError(
                        `${interval.toUpperCase()} backend support is not added yet. Current chart remains active.`
                    );

                    return;

                }


                document
                    .querySelectorAll(".timeframe")
                    .forEach(btn => {

                        btn.classList.remove("active");

                    });


                button.classList.add("active");


                currentInterval = interval;


                loadData();

            });

        });


    /* =====================================================
       SYMBOL
    ===================================================== */

    document
        .getElementById("symbolSelect")
        .addEventListener(
            "change",
            loadData
        );


    /* =====================================================
       AUTO FIT
    ===================================================== */

    document
        .getElementById("fitButton")
        .addEventListener(
            "click",
            () => {

                chart.timeScale().fitContent();

            }
        );


    /* =====================================================
       RESET
    ===================================================== */

    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            () => {

                setChartType("candle");

                chart.timeScale().fitContent();

            }
        );


    /* =====================================================
       FULLSCREEN
    ===================================================== */

    document
        .getElementById("fullscreenButton")
        .addEventListener(
            "click",
            async () => {

                const element =
                    document.documentElement;


                try {

                    if (!document.fullscreenElement) {

                        await element.requestFullscreen();

                    } else {

                        await document.exitFullscreen();

                    }

                } catch (error) {

                    console.error(error);

                }

                setTimeout(
                    resizeChart,
                    300
                );

            }
        );


    /* =====================================================
       CHART TYPE BUTTONS
    ===================================================== */

    document
        .getElementById("candleButton")
        .addEventListener(
            "click",
            () => setChartType("candle")
        );


    document
        .getElementById("lineButton")
        .addEventListener(
            "click",
            () => setChartType("line")
        );


    document
        .getElementById("areaButton")
        .addEventListener(
            "click",
            () => setChartType("area")
        );


    /* =====================================================
       SIGNAL ENGINE
    ===================================================== */

    function updateSignal() {

        if (currentData.length < 50) {

            setSignal(
                "NEUTRAL",
                "Not enough data for signal calculation.",
                "neutral"
            );

            return;

        }


        const ema20 =
            calculateEMA(
                currentData,
                20
            );


        const ema50 =
            calculateEMA(
                currentData,
                50
            );


        const latest =
            currentData[currentData.length - 1];


        const latestEMA20 =
            ema20[ema20.length - 1].value;


        const latestEMA50 =
            ema50[ema50.length - 1].value;


        let score = 0;

        const reasons = [];


        if (
            latest.close >
            latestEMA20
        ) {

            score++;

            reasons.push(
                "Price > EMA20"
            );

        } else {

            score--;

            reasons.push(
                "Price < EMA20"
            );

        }


        if (
            latestEMA20 >
            latestEMA50
        ) {

            score++;

            reasons.push(
                "EMA20 > EMA50"
            );

        } else {

            score--;

            reasons.push(
                "EMA20 < EMA50"
            );

        }


        let signal =
            "NEUTRAL";

        let type =
            "neutral";


        if (score >= 2) {

            signal = "BUY";

            type = "buy";

        } else if (score <= -2) {

            signal = "SELL";

            type = "sell";

        }


        setSignal(
            signal,
            reasons.join(" • "),
            type
        );

    }


    function setSignal(
        signal,
        reason,
        type
    ) {

        const element =
            document.getElementById(
                "signalValue"
            );


        element.textContent =
            signal;


        element.className =
            `signal-value ${type}`;


        document.getElementById(
            "signalReason"
        ).textContent =
            reason;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(message) {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.textContent = message;

        box.style.display = "block";

    }


    function hideError() {

        const box =
            document.getElementById(
                "errorBox"
            );


        box.style.display = "none";

    }


    /* =====================================================
       START APPLICATION
    ===================================================== */

    createChart();

    loadData();

</script>
